<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${chapter.title}"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container"><article class="card">
<h1 th:text="${chapter.title}"></h1>
<p th:text="${chapter.explanation}"></p>
<pre><code th:text="${chapter.codeExample}"></code></pre>
<h3>Resumo final</h3><p th:text="${chapter.summary}"></p>
<h3>Exercício prático</h3><p th:text="${chapter.exercise}"></p>
<div class="hero-actions"><button class="btn" th:attr="onclick=|markChapterDone(${chapter.id})|">Marcar como concluído</button><a class="btn btn-outline" th:href="@{'/chapter/' + ${nextChapterId}}">Próximo capítulo</a></div>
</article></main><script th:src="@{/js/app.js}"></script></body></html>
