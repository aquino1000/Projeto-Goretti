<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exercícios</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container"><h1>Exercícios por módulo</h1><div class="grid">
<div class="card" th:each="ex : ${exercises}"><h3 th:text="|Módulo ${ex.chapterId}|"></h3><p th:text="${ex.question}"></p><ul><li th:each="opt : ${ex.options}" th:text="${opt}"></li></ul><p><strong>Desafio:</strong> <span th:text="${ex.challenge}"></span></p><button class="btn btn-outline" th:attr="onclick=|toggleAnswer('ans-${ex.id}')|">Mostrar resposta</button><p class="answer" th:id="|ans-${ex.id}|" th:text="${ex.answer}"></p></div>
</div></main><script th:src="@{/js/app.js}"></script></body></html>
