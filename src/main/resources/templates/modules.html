<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Módulos</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments :: navbar}"></div>
<main class="container"><h1>Módulos do eBook</h1><div class="grid">
<div class="card" th:each="chapter : ${chapters}"><h3 th:text="${chapter.title}"></h3><p th:text="${chapter.shortDescription}"></p><a class="btn" th:href="@{'/chapter/' + ${chapter.id}}">Ler capítulo</a></div>
</div></main><script th:src="@{/js/app.js}"></script></body></html>
